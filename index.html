		<!-- ===== CAMBIO 2: Script para forzar landscape en móviles ===== -->
		<script type="text/javascript">
			// Función para forzar orientación landscape
			function forceLandscape() {
				if (screen.orientation && typeof screen.orientation.lock === 'function') {
					screen.orientation.lock('landscape').catch(function(error) {
						console.log('No se pudo bloquear la orientación:', error);
					});
				}
			}

			// Función para verificar si es un dispositivo móvil
			function isMobileDevice() {
				return /android|iphone|ipad|ipod|blackberry|iemobile|opera mini|mobile|tablet/i.test(navigator.userAgent.toLowerCase());
			}

			// Ejecutar al cargar la página si es móvil
			if (isMobileDevice()) {
				forceLandscape();
				window.addEventListener('orientationchange', function() {
					setTimeout(forceLandscape, 300);
					// ===== CAMBIO 2.1: Forzar redimensionamiento de Krpano =====
					setTimeout(function() {
						resizeKrpano();
					}, 500);
				});
				window.addEventListener('resize', function() {
					setTimeout(forceLandscape, 300);
					// ===== CAMBIO 2.1: Forzar redimensionamiento de Krpano =====
					setTimeout(function() {
						resizeKrpano();
					}, 500);
				});
			}
			
			// ===== CAMBIO 2.2: Función para redimensionar Krpano =====
			function resizeKrpano() {
				var krpano = document.getElementById('krpanoSWFObject');
				if (krpano && krpano.set) {
					// Forzar recálculo del viewport
					krpano.set('view.hlookat', krpano.get('view.hlookat'));
					// Disparar evento de redimensionamiento
					if (krpano.events && krpano.events.onresize) {
						krpano.events.onresize();
					}
					// Forzar actualización del stage
					if (krpano.stagewidth) {
						krpano.set('stagewidth', window.innerWidth);
						krpano.set('stageheight', window.innerHeight);
					}
					console.log('Krpano redimensionado');
				}
			}
		</script>

		<script type="text/javascript">

			function readDeviceOrientation() {
				var winH = window.innerHeight ? window.innerHeight : jQuery(window).height();
				var winW = window.innerWidth ? window.innerWidth : jQuery(window).width();
				if(!winH || winH == 0){
					winH = '100%';
				}
				jQuery('html').css('height', winH);
				window.scrollTo(0,0);
			}
			jQuery( document ).ready(function() {
				if (/(iphone|ipod|ipad|android|iemobile|webos|fennec|blackberry|kindle|series60|playbook|opera\smini|opera\smobi|opera\stablet|symbianos|palmsource|palmos|blazer|windows\sce|windows\sphone|wp7|bolt|doris|dorothy|gobrowser|iris|maemo|minimo|netfront|semc-browser|skyfire|teashark|teleca|uzardweb|avantgo|docomo|kddi|ddipocket|polaris|eudoraweb|opwv|plink|plucker|pie|xiino|benq|playbook|bb|cricket|dell|bb10|nintendo|up.browser|playstation|tear|mib|obigo|midp|mobile|tablet)/.test(navigator.userAgent.toLowerCase())) {
					if(/iphone/.test(navigator.userAgent.toLowerCase()) && window.self === window.top){
						jQuery('body').css('height', '100.18%');
					}
					if (window.addEventListener) {
						window.addEventListener("load", readDeviceOrientation);
						window.addEventListener("resize", readDeviceOrientation);
						window.addEventListener("orientationchange", readDeviceOrientation);
					}
					setTimeout(function(){readDeviceOrientation();},10);
				}
			});


			function accessWebVr(curScene, curTime){

				unloadPlayer();

				eventUnloadPlugins();

			  loadPlayer(true, curScene, curTime);
			}
			function accessStdVr(curScene, curTime){

				unloadPlayer();

				resetValuesForPlugins();

				loadPlayer(false, curScene, curTime);
			}
			function loadPlayer(isWebVr, curScene, curTime) {
				if (isWebVr) {
					embedpano({
						id:"krpanoSWFObject"
						,xml:"indexdata/index_vr.xml"
						,target:"panoDIV"
						,passQueryParameters:true
						,bgcolor:"#000000"
						,html5:"only+webgl"
						,focus: false
						,vars:{skipintro:true,norotation:true,startscene:curScene,starttime:curTime }
					});
				} else {
					
					var isBot = /bot|googlebot|crawler|spider|robot|crawling/i.test(navigator.userAgent);
					embedpano({
						id:"krpanoSWFObject"

						,xml:"indexdata/index.xml"

						,target:"panoDIV"
						,passQueryParameters:true
						,bgcolor:"#000000"
						,focus: false
						,html5:isBot ? "always" : "only"
						,vars:{startscene:curScene,starttime:curTime}

					});
				}
				if(top.location === self.location){
					kpanotour.Focus.applyFocus();
				}
			}
			function unloadPlayer(){
				if(jQuery('#krpanoSWFObject')){
					removepano('krpanoSWFObject');
				}

			}
			var currentPanotourPlayer = null;
			function getCurrentTourPlayer() {
				if (currentPanotourPlayer == null) {
					currentPanotourPlayer = document.getElementById('krpanoSWFObject');
				}
				return currentPanotourPlayer;
			}
		    function isVRModeRequested() {
				var querystr = window.location.search.substring(1);
				var params = querystr.split('&');
				for (var i=0; i<params.length; i++){
					if (params[i].toLowerCase() == "vr"){
						return true;
					}
				}
				return false;
			}
		</script>
		
		<!-- ===== CAMBIO 3: Script para Safari y barra de navegación ===== -->
		<script type="text/javascript">
			// Mejora para Safari en iOS: ocultar barras de navegación
			function hideSafariUI() {
				if (/iphone|ipad|ipod/i.test(navigator.userAgent.toLowerCase())) {
					// Forzar scroll al inicio para ocultar la barra
					window.scrollTo(0, 0);
					
					// Intentar fullscreen (solo funciona con interacción del usuario)
					if (document.documentElement && document.documentElement.requestFullscreen) {
						document.documentElement.requestFullscreen().catch(function(e) {
							// Silenciar error - normal en Safari sin interacción
						});
					}
				}
			}

			// Ejecutar al cargar
			hideSafariUI();
			
			// Reintentar con interacción del usuario
			document.addEventListener('touchstart', function() {
				hideSafariUI();
				if (/iphone|ipad|ipod/i.test(navigator.userAgent.toLowerCase())) {
					if (document.documentElement && document.documentElement.requestFullscreen) {
						document.documentElement.requestFullscreen().catch(function(e) {});
					}
				}
			}, { once: true });
			
			// Al cambiar de orientación, reajustar scroll y redimensionar Krpano
			window.addEventListener('orientationchange', function() {
				setTimeout(function() {
					window.scrollTo(0, 0);
					// ===== CAMBIO 3.1: Redimensionar Krpano al cambiar orientación =====
					resizeKrpano();
				}, 500);
			});
			
			// ===== CAMBIO 3.2: También al redimensionar la ventana =====
			window.addEventListener('resize', function() {
				setTimeout(function() {
					resizeKrpano();
				}, 300);
			});
		</script>
